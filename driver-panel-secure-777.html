<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Panel</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .panel { width: 100%; max-width: 400px; background: #1a1a1a; padding: 24px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; font-size: 16px; text-align: center; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0084ff; color: white; font-weight: bold; cursor: pointer; }
        #log { margin-top: 20px; font-size: 13px; font-weight: 600; color: #4CAF50; word-break: break-all; }
    </style>
</head>
<body>
    <div class="panel" id="loginBox">
        <h2>ადმინის ავტორიზაცია</h2>
        <input type="password" id="pinInput" placeholder="პინ-კოდი">
        <button onclick="checkPin()">შესვლა</button>
    </div>

    <div class="panel" id="mainPanel" style="display:none;">
        <h2>მძღოლის პანელი</h2>
        <input type="text" id="sessionIdInput" placeholder="სესიის ნომერი (მაგ: a8f94b2e)">
        <button onclick="startTracking()">კლიენტის ძებნა</button>
        <div id="log">მზადაა</div>
    </div>

    <script>
        const PIN = "7777";
        const WS_URL = "wss://carservice-b3ih.onrender.com/ws/";
        let socket = null;

        function checkPin() {
            if(document.getElementById('pinInput').value === PIN) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainPanel').style.display = 'block';
            } else {
                alert("არასწორი პინ-კოდი!");
            }
        }

        function startTracking() {
            const sessionId = document.getElementById('sessionIdInput').value.trim();
            if (!sessionId) return alert("შეიყვანეთ სესია!");

            document.getElementById('log').innerText = "დაკავშირება...";
            socket = new WebSocket(WS_URL + sessionId);

            socket.onopen = () => {
                document.getElementById('log').innerText = "კავშირი დამყარებულია. ველოდებით კლიენტს...";
            };

            socket.onmessage = function(event) {
                let data = JSON.parse(event.data);
                if (data.sender === "client") {
                    document.getElementById('log').innerHTML = 
                        `📍 კლიენტის ლოკაცია:<br>` +
                        `Lat: <b>${data.lat.toFixed(5)}</b><br>` +
                        `Lng: <b>${data.lng.toFixed(5)}</b>`;
                }
            };

            socket.onclose = () => {
                document.getElementById('log').innerText = "კავშირი შეწყდა.";
            };
        }
    </script>
</body>
</html>
