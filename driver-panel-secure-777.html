<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CarService Driver Panel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
}

.panel {
    width: 100%;
    max-width: 520px;
    margin: auto;
    background: #191919;
    border: 1px solid #303030;
    border-radius: 20px;
    padding: 22px;
}

h1 {
    text-align: center;
    margin-top: 0;
}

input {
    width: 100%;
    padding: 14px;
    background: #252525;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 17px;
    text-align: center;
    margin: 12px 0;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #0084ff;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

#mainPanel {
    display: none;
}

.connection {
    text-align: center;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 10px;
    background: #222;
    color: #aaa;
}

.client-card {
    background: #242424;
    border: 1px solid #383838;
    border-radius: 15px;
    padding: 16px;
    margin-top: 12px;
}

.client-card h3 {
    margin: 0 0 10px;
    color: #4ade80;
}

.client-card p {
    margin: 6px 0;
    color: #ccc;
    font-size: 14px;
}

.service {
    font-size: 18px;
    font-weight: bold;
    color: white;
}

.map-btn,
.call-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
}

.map-btn {
    background: #22c55e;
}

.call-btn {
    background: #0084ff;
}

.empty {
    text-align: center;
    color: #777;
    padding: 30px 10px;
}

small {
    color: #888;
}
</style>
</head>

<body>

<div class="panel" id="loginBox">

    <h1>🚗 CarService</h1>

    <p style="text-align:center;">
        მძღოლის / ადმინისტრატორის პანელი
    </p>

    <input
        type="password"
        id="pinInput"
        placeholder="პინ-კოდი"
        inputmode="numeric"
    >

    <button onclick="checkPin()">
        შესვლა
    </button>

</div>


<div class="panel" id="mainPanel">

    <h1>📍 აქტიური გამოძახებები</h1>

    <div class="connection" id="connectionStatus">
        დაკავშირება...
    </div>

    <div id="clientsList">

        <div class="empty">
            ველოდებით კლიენტებს...
        </div>

    </div>

</div>


<script>

const PIN = "7777";

const WS_URL =
    "wss://carservice-b3ih.onrender.com/ws/live";

let socket = null;

let clients = {};


/* =========================
   LOGIN
========================= */

function checkPin() {

    const pin =
        document.getElementById("pinInput").value;

    if (pin === PIN) {

        document.getElementById(
            "loginBox"
        ).style.display = "none";

        document.getElementById(
            "mainPanel"
        ).style.display = "block";

        connect();

    } else {

        alert("არასწორი პინ-კოდი!");

    }
}


/* =========================
   WEBSOCKET
========================= */

function connect() {

    setConnection(
        "🟡 სერვერთან დაკავშირება..."
    );

    socket = new WebSocket(WS_URL);


    socket.onopen = function() {

        setConnection(
            "🟢 ონლაინ — ველოდებით კლიენტებს"
        );

    };


    socket.onmessage = function(event) {

        try {

            const data =
                JSON.parse(event.data);

            console.log(
                "CLIENT DATA:",
                data
            );


            if (
                data.sender === "client" &&
                data.clientId &&
                data.lat !== undefined &&
                data.lng !== undefined
            ) {

                clients[data.clientId] =
                    data;

                renderClients();

            }

        } catch (error) {

            console.error(
                "Data error:",
                error
            );

        }

    };


    socket.onerror = function() {

        setConnection(
            "🔴 კავშირის შეცდომა"
        );

    };


    socket.onclose = function() {

        setConnection(
            "🔴 კავშირი შეწყდა — ხელახლა დაკავშირება..."
        );

        setTimeout(
            connect,
            3000
        );

    };

}


/* =========================
   CONNECTION STATUS
========================= */

function setConnection(text) {

    document.getElementById(
        "connectionStatus"
    ).textContent = text;

}


/* =========================
   CLIENT LIST
========================= */

function renderClients() {

    const container =
        document.getElementById(
            "clientsList"
        );

    const keys =
        Object.keys(clients);


    if (keys.length === 0) {

        container.innerHTML = `
            <div class="empty">
                📍 ველოდებით კლიენტებს...
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    keys.forEach(function(id) {

        const c = clients[id];


        const service =
            c.service ||
            "უცნობი სერვისი";


        const lat =
            Number(c.lat);


        const lng =
            Number(c.lng);


        const time =
            c.time ||
            "ახლახანს";


        const accuracy =
            c.accuracy
                ? Math.round(c.accuracy) + " მ"
                : "უცნობია";


        const mapUrl =
            "https://www.google.com/maps/dir/?api=1&destination="
            + lat
            + ","
            + lng;


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "client-card";


        card.innerHTML = `

            <h3>
                🚨 ახალი გამოძახება
            </h3>

            <div class="service">
                ${escapeHtml(service)}
            </div>

            <p>
                🕐 დრო:
                <b>${escapeHtml(time)}</b>
            </p>

            <p>
                📍 Latitude:
                <b>${lat.toFixed(6)}</b>
            </p>

            <p>
                📍 Longitude:
                <b>${lng.toFixed(6)}</b>
            </p>

            <p>
                🎯 GPS სიზუსტე:
                <b>${escapeHtml(accuracy)}</b>
            </p>

            <a
                class="map-btn"
                href="${mapUrl}"
                target="_blank"
            >
                🗺️ კლიენტთან წასვლა Google Maps-ით
            </a>

        `;


        container.appendChild(
            card
        );

    });

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
