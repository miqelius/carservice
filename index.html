<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarService Online</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-color: #000000;
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --card-bg: #1a1a1a;
            --header-bg: rgba(26, 26, 26, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: var(--bg-color);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        @media (min-width: 480px) {
            .app-container {
                min-height: 850px;
                border-radius: 24px;
                overflow: hidden;
                border: 1px solid var(--border-color);
            }
        }

        header {
            background-color: var(--header-bg);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }

        .controls select {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            outline: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 40px;
        }

        .service-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        .service-card h2 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; }
        .service-card p { margin: 0 0 14px 0; font-size: 13px; opacity: 0.65; }

        .contact-btn {
            display: inline-block;
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 9px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        .contact-btn:active { opacity: 0.8; }

        .phone-link {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            margin: 10px 0;
            letter-spacing: 0.5px;
        }

        .messengers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        .msg-btn {
            padding: 11px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            text-align: center;
            color: white;
        }
        
        .btn-viber { background-color: #7360f2; }
        .btn-wa { background-color: #25D366; }
        .btn-tg { background-color: #0088cc; }
        .btn-messenger { background-color: #0084ff; }

        .lang-footer {
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            opacity: 0.5;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .lang-footer span { cursor: pointer; }
    </style>
</head>
<body data-theme="dark"> <!-- ნაგულისხმევად მუქი თემა -->

    <div class="app-container">
        
        <header>
            <h1>CarService</h1>
            <div class="controls">
                <select onchange="changeTheme(this.value)">
                    <option value="light">Light</option>
                    <option value="dark" selected>Dark</option>
                </select>
            </div>
        </header>

        <div class="content">
            
            <div class="service-card">
                <h2>მოძრავი ხელოსანი</h2>
                <p>დიაგნოსტიკა და შეკეთება</p>
                <a href="#contact-section" class="contact-btn">დაკავშირება</a>
            </div>

            <div class="service-card">
                <h2>ევაკუატორი</h2>
                <p>24/7 ტრანსპორტირება</p>
                <a href="#contact-section" class="contact-btn">დაკავშირება</a>
            </div>

            <div class="service-card">
                <h2>ფხიზელი მძღოლი</h2>
                <p>უსაფრთხო მგზავრობა</p>
                <a href="#contact-section" class="contact-btn">დაკავშირება</a>
            </div>

            <div id="contact-section" class="service-card">
                <h2 style="margin-bottom: 12px;">კონტაქტი</h2>
                
                <a href="tel:+995591622929" class="phone-link">591 62 29 29</a>
                <a href="tel:+995592078078" class="phone-link">592 07 80 78</a>
                <a href="tel:+995555160552" class="phone-link">555 16 05 52</a>

                <div class="messengers">
                    <a href="viber://chat?number=+995555160552" class="msg-btn btn-viber">Viber</a>
                    <a href="https://wa.me/995555160552" class="msg-btn btn-wa">WhatsApp</a>
                    <a href="https://t.me/+995555160552" class="msg-btn btn-tg">Telegram</a>
                    <a href="https://www.facebook.com/profile.php?id=61589185375942" class="msg-btn btn-messenger">Messenger</a>
                </div>

                <div class="lang-footer">
                    <span>GEORGIAN</span> | <span>ENGLISH</span> | <span>RUSSIAN</span>
                </div>
            </div>

        </div>

    </div>

    <script>
        function changeTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
        }
    </script>

</body>
</html>
